apiVersion: apps/v1
kind: Deployment
metadata:
  name: internet-banking
  namespace: banking-channel-services-staging
  labels:
    app: internet-banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: internet-banking
  template:
    metadata:
      labels:
        app: internet-banking
      name: internet-banking
    spec:
      imagePullSecrets:
        - name: nexus-oss-docker
      containers:
        - name: internet-banking
          image: __IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: internet-banking
            - secretRef:
                name: internet-banking
          volumeMounts:
            - mountPath: /log/internet-banking
              name: app-logs
            - mountPath: /heapdumps
              name: heapdump
          env:
            - name: LOG_PATH
              value: /log/internet-banking
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 1
              memory: 2.5Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: app-logs
          hostPath:
            path: /var/log/banking/internet-banking/logs
            type: DirectoryOrCreate
        - name: heapdump
          hostPath:
            path: /var/log/banking/internet-banking/heapdumps
            type: DirectoryOrCreate
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      hostAliases:
        - ip: "192.168.59.10"
          hostnames:
            - "postgres.cerberus.internal"
            - "redis.cerberus.internal"
      restartPolicy: Always