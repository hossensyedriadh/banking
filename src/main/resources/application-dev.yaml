spring:
  datasource:
    driver-class-name: "org.postgresql.Driver"
    url: "${POSTGRES_URL}"
    username: "${POSTGRES_USER}"
    password: "${POSTGRES_PWD}"
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE}
      minimum-idle: ${DB_POOL_MIN_IDLE}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT}
      max-lifetime: ${DB_POOL_MAX_LIFETIME}
      leak-detection-threshold: ${DB_POOL_LEAK_THRESHOLD}
      connection-test-query: "select 1;"
      driver-class-name: "org.postgresql.Driver"
      pool-name: "Hikari Connection Pool [Dev]"
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  data:
    web:
      pageable:
        max-page-size: 40
    redis:
      host: "${REDIS_HOST}"
      port: ${REDIS_PORT}
      username: "${REDIS_USER}"
      password: "${REDIS_PWD}"
      timeout: ${REDIS_READ_TIMEOUT}
      connect-timeout: ${REDIS_CONN_TIMEOUT}
      ssl:
        enabled: true
      repositories:
        enabled: false
      database: 1
      lettuce:
        pool:
          enabled: true
          max-active: ${REDIS_POOL_MAX_ACTIVE}
          max-idle: ${REDIS_POOL_MAX_IDLE}
          min-idle: ${REDIS_POOL_MIN_IDLE}
          time-between-eviction-runs: "${REDIS_POOL_EVICTION_RUNTIME}"
          max-wait: "${REDIS_POOL_MAX_WAIT}"
      client-type: lettuce
      client-name: "cbs"
  modulith:
    events:
      jdbc:
        schema: "modulith"
        schema-initialization:
          enabled: false
server:
  tomcat:
    connection-timeout: 15s
    keep-alive-timeout: 30s
  shutdown: immediate
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
