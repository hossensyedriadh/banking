spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: cbs-api
              uri: "${CBS_BASE_URL:http://cbs.banking-cbs-staging.svc.cluster.local:8080}"
              predicates:
                - Path=/core-banking/**
              filters:
                - StripPrefix=1
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always