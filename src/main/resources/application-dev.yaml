spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: cbs-api
              uri: "${CBS_BASE_URL}"
              predicates:
                - Path=/cbs/**
              filters:
                - StripPrefix=1
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always