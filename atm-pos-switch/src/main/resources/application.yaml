spring:
  application:
    name: "atm-pos-switch"
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:dev}"
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  web:
    error:
      whitelabel:
        enabled: false
      include-binding-errors: on_param
      include-exception: false
      include-stacktrace: never
      include-message: always
      include-path: always
management:
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  info:
    env:
      enabled: true
info:
  application:
    name: "${spring.application.name}"
    version: "1.0.0-SNAPSHOT"
    description: "ATM/POS switch"
  developer:
    name: "Syed Riadh Hossen"
    email: "riadhhossen@gmail.com"
    url: "https://hossensyedriadh.github.io"